name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  scan-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: --lockfile=./frontend/pubspec.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: frontend/.fvmrc
          cache: true
      - run: flutter pub get . packages/core
      - run: dart format --set-exit-if-changed . packages/core
      - run: flutter analyze . packages/core
      - run: flutter test . packages/core
      - run: flutter test --dart-define-from-file=config/public.json . packages/core
      - run: flutter test --platform chrome test/router/rl_path_strategy_test.dart
      - run: sudo apt-get install -y lcov
      - run: flutter test --coverage . packages/core
      - id: coverage
        run: |
          lcov --remove coverage/lcov.info '*.g.dart' '*.freezed.dart' '*.drift.dart' '*/l10n/app_localizations*.dart' '*_native.dart' '*_web.dart' '*_stub.dart' --ignore-errors unused,empty -o coverage/lcov.info
          pct=$(lcov --summary coverage/lcov.info 2>/dev/null | awk '/lines\.+:/ { sub(/%/, "", $2); print $2 }')
          echo "line coverage: $pct%"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
      - run: |
          if git ls-remote --exit-code origin refs/heads/ci-baseline; then
            git fetch origin ci-baseline
            baseline=$(git show FETCH_HEAD:baseline)
            current='${{ steps.coverage.outputs.pct }}'
            echo "baseline: $baseline%, current: $current%"
            ok=$(awk -v c="$current" -v b="$baseline" 'BEGIN { print (c + 0 >= b + 0) }')
            if [ "$ok" != "1" ]; then
              echo "coverage dropped below the recorded baseline"
              exit 1
            fi
          else
            echo "no coverage baseline recorded yet"
          fi

  update-coverage-baseline:
    if: github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          current='${{ needs.frontend.outputs.coverage }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/ci-baseline; then
            git fetch origin ci-baseline
            baseline=$(git show FETCH_HEAD:baseline)
            improved=$(awk -v c="$current" -v b="$baseline" 'BEGIN { print (c + 0 > b + 0) }')
            if [ "$improved" != "1" ]; then
              echo "baseline $baseline% not exceeded by $current%, nothing to update"
              exit 0
            fi
            git checkout -B ci-baseline FETCH_HEAD
          else
            git checkout --orphan ci-baseline
            git rm -rf --quiet .
          fi
          echo "$current" > baseline
          git add baseline
          git commit -m "chore(repo): raise coverage baseline to $current%"
          git push origin ci-baseline
